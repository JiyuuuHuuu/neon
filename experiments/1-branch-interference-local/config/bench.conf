# neon_local init config for the branch-interference experiment.
# Usage: NEON_REPO_DIR=/lake1/jiyu/neon-bench ./target/release/neon_local init --config <this file>
#
# Rationale for each override is in experiments/1-branch-interference-local/README.md
# ("Findings that changed the design").

default_tenant_id = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
generate_local_ssl_certs = false
control_plane_api = 'http://127.0.0.1:1234/upcall/v1/'

[broker]
listen_addr = '127.0.0.1:50051'

[[pageservers]]
id = 1
listen_pg_addr = '127.0.0.1:64000'
listen_http_addr = '127.0.0.1:9898'
pg_auth_type = 'Trust'
http_auth_type = 'Trust'
grpc_auth_type = 'Trust'
no_sync = true

# --- overrides driven by the design review (see README "Findings") ---

# Default is 100 -- a global clock-swept slot cache. At N=256 branches/tenants this
# thrashes and dominates the measurement. Raised well above the working set of open
# layer files we expect (a few hundred to low thousands).
max_file_descriptors = 32768

# Default is 8192 pages = 64 MiB. Raised to 8 GiB so page-cache pressure is not a
# hidden variable between the branches arm (constructive sharing) and the
# separate-tenants arm (destructive competition) -- see README finding 3.
page_cache_size = 1048576

# Default max_usage_pct=80, enabled=true. The pageserver's tenant dir lives on
# /lake1 in this experiment (see NEON_REPO_DIR), which should have ample headroom,
# but the eviction task would otherwise introduce a 60s-period eviction/redownload
# cycle uncorrelated with the experiment's N -- disable it outright. Must be an
# inline table here: this key is captured by NeonLocalInitPageserverConf's flattened
# `other` map and merged verbatim into pageserver.toml, so a `[disk_usage_based_eviction]`
# table header would attach to the wrong parent in TOML's array-of-tables syntax.
disk_usage_based_eviction = { enabled = false }

[[safekeepers]]
id = 1
pg_port = 5454
http_port = 7676

[endpoint_storage]
listen_addr = '127.0.0.1:9993'
